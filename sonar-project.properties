# Read by the component pipeline's SonarCloud step (krizaka/orazaka component.yml, `sonar: true`). The workers' suites run under
# coverage in the pipeline's packs recipe (scripts/workspace.mjs), which writes coverage.xml at this folder's root.
sonar.projectKey=krizaka_orazaka-packs
sonar.organization=krizaka
sonar.sources=.
sonar.exclusions=**/node_modules/**,**/test_*.py,**/tests/**
sonar.tests=.
sonar.test.inclusions=**/test_*.py,**/tests/**
sonar.python.coverage.reportPaths=coverage.xml
