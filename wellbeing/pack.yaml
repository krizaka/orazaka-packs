# ─────────────────────────────────────────────────────────────────────────────
# bien-etre — the REGULATED reference pack (phase J, ADR-055).
#
# THE NAME IS THE FIRST CONTROL. This pack is never called "thérapie". A system
# intended for a MEDICAL PURPOSE — diagnosing, treating, alleviating a condition
# — is a medical device under the EU MDR, with conformity assessment attached,
# and a product marketed as therapy invites a duty-of-care argument the first
# time a user is harmed. The same underlying product, named and scoped as guided
# journaling, session preparation and mood tracking, makes no medical claim.
#
# The positioning follows from that, and the Studios say what they DO and never
# what they treat: this is what a user brings TO their therapist, not instead of
# one. Which is also the more defensible product.
#
# regulatoryClass: REGULATED adds two controls to SENSITIVE's four — versioned
# consent that blocks installation, and a non-bypassable crisis interceptor.
# Both are declared here; neither is implemented by this pack.
#
# ADR-076 (the voice turn) adds the pack's system prompt, inside the safety declaration it belongs
# to: what a CONVERSATIONAL turn of this pack is told first, before anything a caller adds. It says
# what the assistant is and is not, and the engine puts a caller's context after it, never before.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: orazaka.dev/v1
key: bien-etre
version: 1.4.0
tier: DATA
distribution: CLOUD
regulatoryClass: REGULATED

# The domain this pack refuses. Same mechanism as the validation pack; the engine
# holds the interceptor and never the subject.
scopeGuard:
  refusedTerms:
    - diagnostic
    - diagnostiquer
    - est-ce que j'ai
    - ordonnance
    - posologie
    - dosage
    - antidépresseur
    - antidepresseur
    - anxiolytique
    - médicament
    - medicament
    - arrêter mon traitement
    - arreter mon traitement
  refusal: >-
    Je ne pose pas de diagnostic et je ne parle pas de médicaments ou de posologie — ce sont des
    questions pour un professionnel de santé, qui vous connaît et qui peut vous examiner. Ce que je
    peux faire, c'est vous aider à mettre par écrit ce que vous vivez, pour que vous puissiez le lui
    apporter.

# GDPR Art. 9 / Loi 25: health data is a special category, so the lawful basis must exist BEFORE
# the processing does. Bumping this version stops every existing installation until its owner
# agrees again — and that cost is the point.
consent:
  # 2.0 (orazaka#301): the statement now says exactly what the system does — the erase exists
  # (DELETE .../packs/bien-etre/my-data, and one entry), retention is the platform's 30 days, and
  # withdrawing is uninstalling. It is served by the server in the caller's language: `statement`
  # is French (the default), `statements.en` the English one. Both are reviewed text.
  version: "2.0"
  statement: >-
    Ce Studio enregistre ce que vous y écrivez sur votre humeur et votre vécu, et le texte qu'il
    vous renvoie. Ce sont des données de santé au sens du RGPD (art. 9) et de la Loi 25. Elles sont
    chiffrées, conservées 30 jours au plus après chaque entrée, jamais utilisées pour entraîner un
    modèle et jamais incluses dans une statistique. Ce Studio n'est pas un soin : il ne pose aucun
    diagnostic, ne remplace aucun professionnel, et n'est pas un service d'urgence. Vous pouvez tout
    supprimer à tout moment : « Supprimer toutes mes données de bien-être » efface définitivement
    vos entrées, leurs résultats, les fichiers associés et le consentement que vous donnez ici ; vous
    pouvez aussi supprimer une seule entrée. Il ne reste alors qu'une trace sans aucun contenu — la
    date de la suppression et le Studio concerné — qui prouve que vous l'avez demandée. Vous pouvez
    retirer votre consentement à tout moment en désinstallant le Studio : il ne traite plus rien et
    ce qu'il avait enregistré disparaît au plus tard après 30 jours, ou tout de suite si vous
    choisissez de tout supprimer. En installant ce Studio, vous consentez explicitement à ce
    traitement.
  statements:
    en: >-
      This Studio records what you write in it about your mood and what you are going through, and
      the text it sends back. This is health data under the GDPR (art. 9) and Québec's Law 25. It is
      encrypted, kept for 30 days at most after each entry, never used to train a model and never
      included in any statistic. This Studio is not care: it makes no diagnosis, does not replace
      any professional, and is not an emergency service. You can delete everything at any time:
      "Delete all my wellbeing data" permanently erases your entries, their results, the files tied
      to them and the consent you give here; you can also delete a single entry. All that remains is
      a record with no content whatsoever — the date of the deletion and the Studio concerned —
      proving that you asked for it. You can withdraw your consent at any time by uninstalling the
      Studio: it processes nothing more and whatever it had recorded disappears after 30 days at
      most, or immediately if you choose to delete everything. By installing this Studio, you
      explicitly consent to this processing.

# The crisis declaration. The response is FIXED and reviewed by a person: a model asked to compose
# one will produce a number that looks like a crisis line, and someone will dial it.
safety:
  safetyReviewRef: "safety-review/2026-09-10 — texte rédigé et relu à la main, ressources vérifiées à la source le 2026-09-10 (ADR-055 §5), revérifiées une à une à leur source officielle le 2026-10-20 (orazaka#301) ; CA-QC ajoutée et vérifiée à la source le 2026-10-11 (ADR-076) ; réponse et prompt rendus bilingues FR/EN au 2026-10-18 (traduction anglaise à relire par une personne) ; crisisTerms étendus au 2026-10-17 pour la voix (variantes parlées FR et EN) — termes seulement, texte de réponse et lignes inchangés ; à relire par une personne avant toute personne extérieure"
  crisisTerms:
    - suicide
    - me suicider
    - suicider
    - en finir
    - mettre fin à mes jours
    - mettre fin a mes jours
    - plus envie de vivre
    - plus vivre
    - me faire du mal
    - me tuer
    - disparaître pour toujours
    - disparaitre pour toujours
    # The listening moment (Yororis) is spoken, so the cues are the ways a person says it aloud, in
    # both languages the presences speak. The guard folds accents and case and then looks for the
    # term inside the turn (SafetyInterceptor.fold), so each term is a phrase, never a lone word
    # that also lives in "mourir de rire". An apostrophe is written both ways: a keyboard types
    # ' and a phone types the typographic one, and the fold does not unify them.
    - envie de mourir
    - veux mourir
    - voudrais mourir
    - veux plus vivre
    - veux pas vivre
    - plus la force de vivre
    - m'enlever la vie
    - m’enlever la vie
    - j'en peux plus de vivre
    - j’en peux plus de vivre
    - me pendre
    - kill myself
    - end my life
    - take my own life
    - want to die
    - wanna die
    - hurt myself
    - harm myself
    - better off dead
    - no reason to live
    - don't want to live
    - don’t want to live
    - don't want to be alive
    - don’t want to be alive
  response: >-
    Je m'arrête là, parce que ce que vous venez d'écrire compte plus que l'exercice en cours. Je ne
    suis pas en mesure de vous accompagner là-dessus, et je ne veux pas vous laisser seul·e avec ça.
    Des personnes formées écoutent, gratuitement et tout de suite :

    I'm stopping here, because what you just wrote matters more than the exercise we were doing. I
    can't support you with this, and I don't want to leave you alone with it. Trained people listen,
    for free and right away:
  # Verified at the source on 2026-09-10. A region absent here is a region this pack does not
  # install in — an approximate number is not a smaller version of a correct one.
  resources:
    FR:
      region: FR
      label: "3114 — Numéro national de prévention du suicide"
      contact: "3114"
      availability: "24h/24 et 7j/7, confidentiel et gratuit"
      sourceUrl: "https://www.bourgogne-franche-comte.ars.sante.fr/le-3114-numero-national-de-prevention-du-suicide"
      verifiedOn: "2026-10-20"
    BE-FR:
      region: BE-FR
      label: "Centre de Prévention du Suicide"
      contact: "0800 32 123"
      availability: "24h/24 et 7j/7, anonyme et gratuit"
      sourceUrl: "https://www.preventionsuicide.be/la-ligne-decoute-0800-32-123"
      verifiedOn: "2026-10-20"
    BE-NL:
      region: BE-NL
      label: "Zelfmoordlijn 1813"
      contact: "1813"
      availability: "24 uur op 24, volledig gratis en anoniem"
      sourceUrl: "https://www.zelfmoord1813.be/ik-heb-hulp-nodig/bellen-met-de-zelfmoordlijn"
