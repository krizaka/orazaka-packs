# Builds and tests orazaka-packs inside the Orazaka workspace (every upstream repository is
# built from source at its default branch), then publishes to GitHub Packages on a v* tag.
# The pipeline itself lives in krizaka/orazaka so every repository is checked the same way.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      golden_stack:
        description: "Run actual goldens on the provisioned, trusted orazaka-golden runner"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  component:
    permissions:
      contents: read
      packages: write
      # The shared component pipeline publishes npm packages with provenance (OIDC): a reusable
      # workflow cannot be granted more than its caller holds, so its absence fails at startup.
      id-token: write
    uses: krizaka/orazaka/.github/workflows/component.yml@73c905465a0fad85976c84ccbf2f0e95f21a17b1 # main
    with:
      component: orazaka-packs
      duplication: true
    secrets: inherit

  schema-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Compare golden exceptions with the immutable PR base, not a second editable baseline.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          GOLDEN_BASE_SHA: ${{ github.event.pull_request.base.sha }}

  # Never expose an authenticated local stack/self-hosted runner to pull-request code.
  # Enable after provisioning the dedicated runner, environment protection, and test account.
  golden-stack:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.golden_stack) || (github.event_name == 'push' && vars.GOLDEN_STACK_ENABLED == 'true')) }}
    runs-on: [self-hosted, orazaka-golden]
    environment: golden-stack
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run golden:run -- --config "$GOLDEN_STACK_CONFIG"
        env:
          GOLDEN_STACK_CONFIG: ${{ vars.GOLDEN_STACK_CONFIG }}

  # The three Python workers: the org's reusable python-ci (krizaka/.github#149). Each caller job is named like its former
  # check's origin; the required checks keep their names through the shims below (branch protection untouched).
  py-photo:
    # profile-photo-check's worker: the rules, the face logic (fake engine) and, with the pinned models fetched, the real
    # YuNet + SFace on a public-domain photograph.
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: profile-photo-check/worker
      requirements: profile-photo-check/requirements.txt
      extra-packages: ""
      setup-command: python fetch_models.py
      test-command: |
        python test_rules.py
        python test_faces.py
        python test_worker.py

  py-document-validation:
    # document-validation's worker (Yomizaka's checks): the deterministic rules, the authenticity signals and their declared
    # contract, the screening — no model needed. These tests existed but no job ran them (2026-10-22).
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: document-validation/worker
      extra-packages: pypdf pika pyyaml
      test-command: |
        python test_rules.py
        python test_golden.py
        python test_authenticity.py
        python test_authenticity_formats.py
        python test_screening.py
        python test_identify.py

  py-authenticity:
    # message-authenticity's worker: language, thresholds, the closed report, protocol conformance — no model needed.
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: message-authenticity/worker
      extra-packages: pika pyyaml
      test-command: |
        python test_authenticity.py

  py-safety:
    # media-safety's worker: the closed rules (a safety check fails closed), the protocol — no model needed.
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: media-safety/worker
      extra-packages: pika pyyaml
      test-command: |
        python test_safety.py

  py-screening:
    # tenant-screening-qc's worker (the gated saga): every path of the saga on the mock — all clear, a stop after the documents, a stop
    # after the court records with credit never called, a provider error, a missing consent — no model, no network.
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: tenant-screening-qc/worker
      extra-packages: pika pyyaml
      test-command: python test_screening.py

  py-common:
    # The broker connection every worker shares (worker-common/worker_broker.py): tested once.
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/python-ci.yml@f268fbefb48194cf680854f1f2aae69a10f5d1a7 # v1.3.4
    with:
      working-directory: worker-common
      extra-packages: pika
      test-command: python test_worker_broker.py

  # The required checks keep their names; each reads its gate's verdict. They go when protection requires the gates.
  photo-worker:
    needs: py-photo
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.py-photo.outputs.result }}
    steps:
      - run: test "$RESULT" = success

  authenticity-worker:
    needs: py-authenticity
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.py-authenticity.outputs.result }}
    steps:
      - run: test "$RESULT" = success

  safety-worker:
    needs: py-safety
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    env:
      RESULT: ${{ needs.py-safety.outputs.result }}
    steps:
      - run: test "$RESULT" = success
