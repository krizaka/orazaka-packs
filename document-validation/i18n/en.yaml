pack:
  label: Document Verification
  tagline: Check a contract against the rules, and a PDF for signs of tampering.
  description: >-
    Check a document against a versioned body of rules — every finding cites its rule, its
    source and the passage that justifies it — and examine a PDF file for the signals that
    something was altered. Reports, never legal advice.
category:
  label: Business & documents
  description: "Packs that do the work: check documents, prospect."
studios:
  compliance-check:
    label: Compliance Check
    tagline: Your lease or contract, checked against the rules of its jurisdiction.
    description: >-
      Runs a lease or a contract against the rules of its jurisdiction, as they stood on a
      date you pick. Each finding gives its rule, its source and the passage of the document.
  document-authenticity:
    label: Document Authenticity
    tagline: A PDF's metadata, structure and fonts, examined for signs of tampering.
    description: >-
      Examines the file itself — who produced it, when, with what, and whether it was edited
      afterwards — and lists the points worth clearing up. It never judges what the document says.
